<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppDrawer Position Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header-simulation {
            width: 100%;
            height: 48px;
            background: #f5f5f5;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-button-test {
            width: 44px;
            height: 44px;
            background: #0078d4;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .drawer-test {
            position: fixed;
            width: 320px;
            height: 300px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 999999;
        }

        .drawer-test.open {
            display: block;
        }

        /* Firefox-specific positioning test */
        @-moz-document url-prefix() {
            .drawer-test {
                position: fixed !important;
                top: var(--drawer-top, auto) !important;
                left: var(--drawer-left, auto) !important;
            }
        }        .info-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
            max-width: 300px;
            z-index: 1000000;
        }
    </style>
</head>
<body>
    <div class="header-simulation">
        <button id="appButton" class="app-button-test">⋮⋮⋮</button>
    </div>

    <div id="drawer" class="drawer-test">
        <div style="padding: 20px;">
            <h3>Test Drawer</h3>
            <p>This drawer should appear below the button</p>
        </div>
    </div>

    <div class="info-panel">
        <div><strong>Browser:</strong> <span id="browser"></span></div>
        <div><strong>Button Position:</strong> <span id="buttonPos"></span></div>
        <div><strong>Drawer Position:</strong> <span id="drawerPos"></span></div>
        <div><strong>Viewport:</strong> <span id="viewport"></span></div>
    </div>

    <script>
        const button = document.getElementById('appButton');
        const drawer = document.getElementById('drawer');
        const browserSpan = document.getElementById('browser');
        const buttonPosSpan = document.getElementById('buttonPos');
        const drawerPosSpan = document.getElementById('drawerPos');
        const viewportSpan = document.getElementById('viewport');

        // Browser detection
        const userAgent = navigator.userAgent;
        const browser = userAgent.includes('Chrome') ? 'Chrome' :
                       userAgent.includes('Firefox') ? 'Firefox' :
                       userAgent.includes('Edg') ? 'Edge' : 'Other';
        browserSpan.textContent = browser;

        function updateInfo() {
            const buttonRect = button.getBoundingClientRect();
            const drawerRect = drawer.getBoundingClientRect();

            buttonPosSpan.textContent = `x: ${buttonRect.left}, y: ${buttonRect.top}, w: ${buttonRect.width}, h: ${buttonRect.height}`;
            drawerPosSpan.textContent = `x: ${drawerRect.left}, y: ${drawerRect.top}, w: ${drawerRect.width}, h: ${drawerRect.height}`;
            viewportSpan.textContent = `${window.innerWidth} x ${window.innerHeight}`;
        }

        function positionDrawer() {
            const buttonRect = button.getBoundingClientRect();
            const drawerWidth = 320;
            const viewportWidth = window.innerWidth;
            const isFirefox = browser === 'Firefox';

            // Calculate position below button, centered
            let topPosition = buttonRect.bottom + 8;
            let leftPosition = buttonRect.left + (buttonRect.width / 2) - (drawerWidth / 2);

            // Boundary checks
            if (leftPosition < 10) {
                leftPosition = 10;
            } else if (leftPosition + drawerWidth > viewportWidth - 10) {
                leftPosition = viewportWidth - drawerWidth - 10;
            }

            // Set CSS variables and inline styles
            drawer.style.setProperty('--drawer-top', `${topPosition}px`);
            drawer.style.setProperty('--drawer-left', `${leftPosition}px`);
            drawer.style.top = `${topPosition}px`;
            drawer.style.left = `${leftPosition}px`;

            // Firefox-specific DOM manipulation
            if (isFirefox) {
                setTimeout(() => {
                    drawer.style.setProperty('top', `${topPosition}px`, 'important');
                    drawer.style.setProperty('left', `${leftPosition}px`, 'important');
                    drawer.style.setProperty('position', 'fixed', 'important');
                    console.log('Firefox - Forced positioning applied');
                }, 50);
            }

            console.log('Positioning drawer:', {
                buttonRect,
                calculatedTop: topPosition,
                calculatedLeft: leftPosition,
                browser,
                isFirefox
            });

            updateInfo();
        }        button.addEventListener('click', function() {
            const isOpen = drawer.classList.contains('open');

            if (isOpen) {
                drawer.classList.remove('open');
            } else {
                positionDrawer();
                drawer.classList.add('open');
            }
        });

        // Update info on load and resize
        window.addEventListener('load', updateInfo);
        window.addEventListener('resize', function() {
            if (drawer.classList.contains('open')) {
                positionDrawer();
            } else {
                updateInfo();
            }
        });

        updateInfo();
    </script>
</body>
</html>

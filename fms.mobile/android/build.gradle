// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"

        // Kotlin JVM target for consistency
        kotlinJvmTarget = "11"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
    }
}

// Force compatible AndroidX versions and align JVM targets
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.configurations.all {
                resolutionStrategy {
                    force 'androidx.core:core:1.9.0'
                    force 'androidx.core:core-ktx:1.9.0'
                    force 'androidx.appcompat:appcompat:1.5.1'
                    force 'androidx.appcompat:appcompat-resources:1.5.1'
                    force 'androidx.annotation:annotation-experimental:1.3.0'
                }
            }

            // Set namespace for libraries that don't have it (required for AGP 8+)
            if (!project.android.namespace) {
                def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifest = new XmlSlurper().parse(manifestFile)
                    def packageName = manifest.@package.toString()
                    if (packageName) {
                        project.android.namespace = packageName
                    }
                }
            }

            // Enable buildConfig for libraries that need it
            if (project.android.hasProperty('buildFeatures')) {
                project.android.buildFeatures.buildConfig = true
            }

            // Align Java version for ALL android projects
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_11
                    targetCompatibility JavaVersion.VERSION_11
                }
            }
        }

        // Align Kotlin JVM target if Kotlin plugin is applied
        if (project.plugins.hasPlugin('kotlin-android') || project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
            project.android {
                kotlinOptions {
                    jvmTarget = rootProject.ext.kotlinJvmTarget
                }
            }
        }
    }
}

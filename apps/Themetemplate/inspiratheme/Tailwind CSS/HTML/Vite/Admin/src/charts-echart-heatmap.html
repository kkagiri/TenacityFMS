<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="Heatmap Echart" }} {{> head-css }}
    </head>

    <body>
        <div class="wrapper">
            {{> topbar subtitle="Charts" title="Heatmap Echart" }} {{> sidenav }}

            <div class="page-content">
                <main>
                    {{> page-title subtitle="Charts" title="Heatmap Echart" }}

                    <div class="container-fluid">
                        <div class="grid xl:grid-cols-2 gap-base">
                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Heatmap Echart</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-heatmap" style="min-height: 300px"></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Heatmap Chart</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-heatmap3" style="min-height: 300px"></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Heatmap - 20K Data Chart</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-heatmap4" style="min-height: 300px"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>

                {{> footer }}
            </div>
        </div>

        {{> customizer }}

        <script type="module" src="assets/js/pages/chart-echart-heatmap.js"></script>
    </body>
</html>

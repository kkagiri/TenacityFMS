<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="PDF Viewer" }} {{> head-css }}
    </head>

    <body>
        <div class="wrapper">
            {{> topbar subtitle="Plugins" title="PDF Viewer" }} {{> sidenav }}

            <div class="page-content">
                <main>
                    {{> page-title subtitle="Plugins" title="PDF Viewer" }}

                    <div class="container-fluid">
                        <div class="grid lg:grid-cols-1 gap-base">
                            <div class="card">
                                <div class="card-body">
                                    <div class="text-center">
                                        <div class="inline-flex text-nowrap">
                                            <button id="prev" class="btn bg-dark rounded-e-none text-white">
                                                <i class="iconify tabler--arrow-left"></i>
                                                <span class="hidden sm:inline">Previous</span>
                                            </button>

                                            <button id="next" class="btn bg-dark rounded-none text-white">
                                                <i class="iconify tabler--arrow-right"></i>
                                                <span class="hidden sm:inline">Next</span>
                                            </button>

                                            <button id="zoomin" class="btn bg-dark rounded-none text-white">
                                                <i class="iconify tabler--zoom-in"></i>
                                                <span class="hidden sm:inline">Zoom In</span>
                                            </button>

                                            <button id="zoomout" class="btn bg-dark rounded-none text-white">
                                                <i class="iconify tabler--zoom-in"></i>
                                                <span class="hidden sm:inline">Zoom Out</span>
                                            </button>

                                            <button id="zoomfit" class="btn bg-dark rounded-s-none text-white">100%</button>

                                            <div class="flex">
                                                <input type="number" class="form-input ms-3 rounded-e-none!" id="page_num" style="width: 50px" />
                                                <span class="border-default-300 flex rounded-e border border-s-0 px-3 py-1.5 bg-light/15" id="page_count">/ 00</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mt-3 flex justify-center overflow-auto text-center">
                                        <canvas id="the-canvas" class="pdfcanvas border-default-300 rounded-lg border"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>

                {{> footer }}
            </div>
        </div>

        {{> customizer }}

        <script type="module" src="assets/js/pages/plugins-pdf-viewer.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="Area Echart" }} {{> head-css }}
    </head>

    <body>
        <div class="wrapper">
            {{> topbar subtitle="Charts" title="Area Echart" }} {{> sidenav }}

            <div class="page-content">
                <main>
                    {{> page-title subtitle="Charts" title="Area Echart" }}

                    <div class="container-fluid">
                        <div class="grid xl:grid-cols-2 gap-base">
                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Area Chart</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-line" style="min-height: 300px"></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Stacked Area Chart</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-line-stacked" style="min-height: 300px"></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Area with Marker</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-line-marker" style="min-height: 300px"></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Dynamic Area</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-dynamic-line" style="min-height: 300px"></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Step Area</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-step-line" style="min-height: 300px"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>

                {{> footer }}
            </div>
        </div>

        {{> customizer }}

        <script type="module" src="assets/js/pages/chart-echart-area.js"></script>
    </body>
</html>

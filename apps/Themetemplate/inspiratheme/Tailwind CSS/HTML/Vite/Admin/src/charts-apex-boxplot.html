<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="Boxplot Apexchart" }} {{> head-css }}
    </head>

    <body>
        <div class="wrapper">
            {{> topbar subtitle="Charts" title="Boxplot Apexchart" }} {{> sidenav }}

            <div class="page-content">
                <main>
                    {{> page-title subtitle="Charts" title="Boxplot Apexchart" }}

                    <div class="container-fluid">
                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-base">
                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Basic Boxplot</h4>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div id="basic-boxplot" class="apex-charts"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Scatter Boxplot</h4>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div id="scatter-boxplot" class="apex-charts"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Horizontal BoxPlot</h4>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div id="horizontal-boxplot" class="apex-charts"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>

                {{> footer }}
            </div>
        </div>

        {{> customizer }}

        <script type="module" src="assets/js/pages/chart-apex-boxplot.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="Radar Apexchart" }} {{> head-css }}
    </head>

    <body>
        <div class="wrapper">
            {{> topbar subtitle="Charts" title="Radar Apexchart" }} {{> sidenav }}

            <div class="page-content">
                <main>
                    {{> page-title subtitle="Charts" title="Radar Apexchart" }}

                    <div class="container-fluid">
                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-base">
                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Basic Radar Chart</h4>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div id="basic-radar" class="apex-charts"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Radar with Polygon-fill</h4>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div id="radar-polygon" class="apex-charts"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Radar – Multiple Series</h4>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div id="radar-multiple-series" class="apex-charts"></div>
                                        <div class="mt-2 text-center">
                                            <button id="update-radar" class="btn btn-sm bg-primary text-white hover:bg-primary-hover">Update</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>

                {{> footer }}
            </div>
        </div>

        {{> customizer }}

        <script type="module" src="assets/js/pages/chart-apex-radar.js"></script>
    </body>
</html>

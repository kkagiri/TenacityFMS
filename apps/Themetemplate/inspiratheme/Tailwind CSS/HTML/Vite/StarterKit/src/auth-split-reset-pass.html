<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="Reset Password" }} {{> head-css }}
    </head>

    <body>
        <div class="min-h-screen">
            <div class="flex h-full w-full">
                <div class="hidden w-full md:block">
                    <div class="relative h-full overflow-hidden bg-[url('../images/auth.jpg')] bg-cover bg-center bg-no-repeat">
                        <div class="from-zinc-800 via-zinc-800/80 to-zinc-800/50 absolute inset-0 flex items-end justify-center bg-linear-to-t p-9"></div>
                    </div>
                </div>
                <div class="min-w-full md:min-w-106 md:max-w-118">
                    <div class="card relative flex min-h-screen flex-col justify-between rounded-none p-12.5">
                        <div class="mb-7.5 flex flex-col items-center justify-center text-center">
                            <a href="index.html" class="auth-logo">
                                <img src="/images/logo-black.png" alt="logo" class="flex dark:hidden" />
                                <img src="/images/logo.png" alt="dark logo" class="hidden dark:flex" />
                            </a>
                        </div>

                        <div>
                            <h4 class="font-bold mb-2 text-default-900 text-lg text-center">Forgot Password?</h4>
                            <p class="text-default-400 mx-auto w-full text-center lg:w-72">Enter your email address and we'll send you a link to reset your password.</p>
                            <form action="index.html" class="mt-9">
                                <div class="mb-6">
                                    <label for="userEmail" class="form-label">
                                        Email address
                                        <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-icon-group">
                                        <i class="iconify tabler--mail input-icon"></i>
                                        <input type="email" class="form-input" id="userEmail" placeholder="you&#64;example.com" required />
                                    </div>
                                </div>

                                <div class="mb-6">
                                    <div class="flex items-center gap-2">
                                        <input class="form-checkbox form-checkbox-light size-4.5" type="checkbox" id="rememberMe" />
                                        <label class="form-check-label" for="rememberMe">Agree the Terms & Policy</label>
                                    </div>
                                </div>

                                <div>
                                    <button type="submit" class="btn bg-primary w-full py-3 font-semibold text-white hover:bg-primary-hover">Send Request</button>
                                </div>
                            </form>

                            <p class="text-default-400 mt-7.5 text-center">
                                Return to
                                <a href="auth-split-sign-in.html" class="text-primary font-semibold underline underline-offset-4">Sign in</a>
                            </p>
                        </div>

                        <p class="text-default-400 mt-7.5 text-center">
                            &copy;
                            <script>
                                document.write(new Date().getFullYear())
                            </script>
                            Inspinia - by
                            <span>WebAppLayers</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        {{> customizer }}
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefox Button Click Test</title>
    <style>
        .test-button {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            min-height: 40px;
            border-radius: 8px;
            padding: 0;
            transition: background-color 0.2s ease;

            /* Force visibility and clickability in all browsers */
            visibility: visible !important;
            pointer-events: auto !important;

            /* Browser-specific appearance resets */
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;

            /* Touch feedback */
            -webkit-tap-highlight-color: rgba(0, 120, 212, 0.1);
        }

        .test-button:hover {
            background-color: rgba(0, 120, 212, 0.1);
        }

        .test-button:active,
        .test-button:focus {
            background-color: rgba(0, 120, 212, 0.2);
            outline: none;
        }

        /* Firefox-specific fixes */
        .test-button::-moz-focus-inner {
            border: 0;
            padding: 0;
        }

        .grid-dots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            width: 20px;
            height: 20px;
        }

        .grid-dots span {
            width: 5px;
            height: 5px;
            background-color: #333;
            border-radius: 50%;
            display: block;
            transition: background-color 0.2s ease;
        }

        .test-button:hover .grid-dots span {
            background-color: #0078d4;
        }

        .log {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
        }

        .browser-info {
            margin-bottom: 20px;
            padding: 10px;
            background: #e8f4f8;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="browser-info">
        <h3>Browser Compatibility Test</h3>
        <p><strong>User Agent:</strong> <span id="userAgent"></span></p>
        <p><strong>Browser:</strong> <span id="browser"></span></p>
        <p><strong>Test:</strong> Click the button below to test Firefox compatibility</p>
    </div>

    <button type="button" id="testButton" class="test-button" aria-label="Test Button">
        <div class="grid-dots">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
    </button>

    <div class="log" id="log"></div>

    <script>
        // Browser detection
        const userAgent = navigator.userAgent;
        const browser = userAgent.includes('Chrome') ? 'Chrome' :
                       userAgent.includes('Firefox') ? 'Firefox' :
                       userAgent.includes('Edg') ? 'Edge' : 'Other';

        document.getElementById('userAgent').textContent = userAgent;
        document.getElementById('browser').textContent = browser;

        // Logging function
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        // Test button functionality
        const button = document.getElementById('testButton');
        let clickCount = 0;

        // Multiple event handlers for testing
        button.addEventListener('click', (e) => {
            clickCount++;
            log(`CLICK event fired (count: ${clickCount}) - Target: ${e.target.tagName}`);
        });

        button.addEventListener('mousedown', (e) => {
            log(`MOUSEDOWN event fired - Target: ${e.target.tagName}`);
        });

        button.addEventListener('mouseup', (e) => {
            log(`MOUSEUP event fired - Target: ${e.target.tagName}`);
        });

        button.addEventListener('pointerdown', (e) => {
            log(`POINTERDOWN event fired - Target: ${e.target.tagName}`);
        });

        button.addEventListener('pointerup', (e) => {
            log(`POINTERUP event fired - Target: ${e.target.tagName}`);
        });

        // Test DevExtreme-like button simulation
        button.addEventListener('dxclick', (e) => {
            log(`DXCLICK event fired (DevExtreme simulation) - Target: ${e.target.tagName}`);
        });

        // Initial log
        log(`Browser compatibility test initialized for ${browser}`);
        log('Click the button above to test event handling');
    </script>
</body>
</html>

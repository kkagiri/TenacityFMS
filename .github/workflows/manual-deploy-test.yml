name: Manual Deployment Test
on:
  workflow_dispatch:
    inputs:
      deploymentType:
        description: "What to deploy"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - frontend
          - backend
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
          - development
      skipBackup:
        description: "Skip backup before deployment"
        required: false
        default: false
        type: boolean
      skipHealthCheck:
        description: "Skip health check after deployment"
        required: false
        default: false
        type: boolean
      verbose:
        description: "Enable verbose logging"
        required: false
        default: false
        type: boolean

jobs:
  manual-deployment:
    runs-on: [self-hosted, Windows, X64, HYFMS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check project directories
        run: |
          echo "Checking project directories..."

          # Check frontend project
          if exist "fms.frontend" (
            echo "✓ fms.frontend directory found"
          ) else (
            echo "⚠ Warning: fms.frontend directory not found"
          )

          # Check backend projects
          set MISSING_BACKEND=0

          if not exist "FMS.WebClient" (
            echo "⚠ Warning: FMS.WebClient directory not found"
            set MISSING_BACKEND=1
          ) else (
            echo "✓ FMS.WebClient directory found"
          )

          if not exist "FMS.Application" (
            echo "⚠ Warning: FMS.Application directory not found"
            set MISSING_BACKEND=1
          ) else (
            echo "✓ FMS.Application directory found"
          )

          if not exist "FMS.Persistence" (
            echo "⚠ Warning: FMS.Persistence directory not found"
            set MISSING_BACKEND=1
          ) else (
            echo "✓ FMS.Persistence directory found"
          )

          if not exist "FMS.Domain" (
            echo "⚠ Warning: FMS.Domain directory not found"
            set MISSING_BACKEND=1
          ) else (
            echo "✓ FMS.Domain directory found"
          )

          if not exist "FMS.Infrastructure" (
            echo "⚠ Warning: FMS.Infrastructure directory not found"
            set MISSING_BACKEND=1
          ) else (
            echo "✓ FMS.Infrastructure directory found"
          )

          if not exist "FMS.BackgroundServices" (
            echo "⚠ Warning: FMS.BackgroundServices directory not found (optional)"
          ) else (
            echo "✓ FMS.BackgroundServices directory found"
          )

          if %MISSING_BACKEND% NEQ 0 (
            echo "⚠ Warning: Some required backend projects are missing"
          ) else (
            echo "✓ All required backend projects found"
          )
        shell: cmd

      - name: Execute deployment (Frontend only)
        if: ${{ inputs.deploymentType == 'frontend' }}
        run: |
          echo "Running frontend-only deployment test..."
          powershell -File ./deploy.ps1 -frontendOnly -environment "${{ inputs.environment }}" ${{ inputs.skipBackup && '-noBackup' || '' }} ${{ inputs.skipHealthCheck && '-skipHealthCheck' || '' }} ${{ inputs.verbose && '-verbose' || '' }}
          echo "Test deployment completed with exit code %ERRORLEVEL%"

          echo "Recent deployment log:"
          powershell -Command "Get-ChildItem -Path './logs' -Filter 'deployment_log_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { echo \"Log file: $_\"; Get-Content -Path $_.FullName -Tail 10 }"
        shell: cmd

      - name: Execute deployment (Backend only)
        if: ${{ inputs.deploymentType == 'backend' }}
        run: |
          echo "Running backend-only deployment test..."
          powershell -File ./deploy.ps1 -backendOnly -environment "${{ inputs.environment }}" ${{ inputs.skipBackup && '-noBackup' || '' }} ${{ inputs.skipHealthCheck && '-skipHealthCheck' || '' }} ${{ inputs.verbose && '-verbose' || '' }}
          echo "Test deployment completed with exit code %ERRORLEVEL%"

          echo "Recent deployment log:"
          powershell -Command "Get-ChildItem -Path './logs' -Filter 'deployment_log_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { echo \"Log file: $_\"; Get-Content -Path $_.FullName -Tail 10 }"
        shell: cmd

      - name: Execute deployment (Full)
        if: ${{ inputs.deploymentType == 'full' }}
        run: |
          echo "Running full deployment test..."
          powershell -File ./deploy.ps1 -environment "${{ inputs.environment }}" ${{ inputs.skipBackup && '-noBackup' || '' }} ${{ inputs.skipHealthCheck && '-skipHealthCheck' || '' }} ${{ inputs.verbose && '-verbose' || '' }}
          echo "Test deployment completed with exit code %ERRORLEVEL%"

          echo "Recent deployment log:"
          powershell -Command "Get-ChildItem -Path './logs' -Filter 'deployment_log_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { echo \"Log file: $_\"; Get-Content -Path $_.FullName -Tail 10 }"
        shell: cmd

name: Production Deploy

on:
  push:
    branches:
      - productionv1

jobs:
  deploy:
    runs-on:
      - self-hosted
      - windows
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate protected files
        shell: pwsh
        run: |
          $forbidden = @(
            'FMS.WebClient/Program.cs',
            'fms.frontend/src/api/axiosInstance.js'
          )
          $before = $env:GITHUB_EVENT_BEFORE
          if ([string]::IsNullOrEmpty($before) -or $before -eq ('0' * 40)) {
            try {
              $changed = git diff --name-only HEAD^ HEAD
            } catch {
              $changed = git ls-files
            }
          } else {
            $changed = git diff --name-only $before $env:GITHUB_SHA
          }
          $violations = $changed | Where-Object { $forbidden -contains $_ }
          if ($violations) {
            Write-Error "Protected files modified in this push: $($violations -join ', ')"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        working-directory: fms.frontend
        shell: pwsh
        run: npm install

      - name: Build frontend bundle
        working-directory: fms.frontend
        shell: pwsh
        run: npm run build:prod

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET dependencies
        shell: pwsh
        run: dotnet restore Hyoung.Fms.sln

      - name: Publish Web API
        shell: pwsh
        run: dotnet publish FMS.WebClient/FMS.WebClient.csproj --configuration Release --output FMS.WebClient/publish

      - name: Publish deployment tool
        shell: pwsh
        run: dotnet publish FMS.Deployment/FMS.Deployment.csproj --configuration Release --output FMS.Deployment/publish

      - name: Run deployment
        shell: pwsh
        working-directory: FMS.Deployment/publish
        env:
          EmailSettings__Password: ${{ secrets.EMAIL_SETTINGS_PASSWORD }}
          EmailSettings__Username: ${{ secrets.EMAIL_SETTINGS_USERNAME }}
        run: |
          $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
          $logDir = 'C:\\logs\\fms-deployment'
          if (-not (Test-Path $logDir)) {
            New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          }
          $logPath = Join-Path $logDir "deployment_$timestamp.txt"
          .\HyoungFMS.Deployment.exe --environment production --rollback-on-failure --log-file $logPath

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-log
          path: C:\\logs\\fms-deployment
          if-no-files-found: ignore

name: Selective Deploy
on:
  push:
    branches:
      - productionv1
jobs:
  detect-changes:
    runs-on: [self-hosted, Windows, X64, HYFMS]
    outputs:
      frontend-changed: ${{ steps.check-changes.outputs.frontend-changed }}
      backend-changed: ${{ steps.check-changes.outputs.backend-changed }}
      package-changed: ${{ steps.check-changes.outputs.package-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 2

      - name: Check for changes
        id: check-changes
        run: |
          $changedFiles = git diff --name-only HEAD^ HEAD

          $frontendChanged = ($changedFiles | Where-Object { $_ -like "fms.frontend/*" }) -ne $null
          $backendChanged = ($changedFiles | Where-Object { $_ -like "FMS.WebClient/*" }) -ne $null
          $packageChanged = ($changedFiles | Where-Object { $_ -like "fms.frontend/package*.json" }) -ne $null

          Write-Host "::set-output name=frontend-changed::$frontendChanged"
          Write-Host "::set-output name=backend-changed::$backendChanged"
          Write-Host "::set-output name=package-changed::$packageChanged"

          Write-Host "Frontend changed: $frontendChanged"
          Write-Host "Backend changed: $backendChanged"
          Write-Host "Package files changed: $packageChanged"
        shell: powershell

  deploy-frontend-only:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'True' && needs.detect-changes.outputs.backend-changed != 'True' }}
    runs-on: [self-hosted, Windows, X64, HYFMS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install React dependencies
        if: ${{ needs.detect-changes.outputs.package-changed == 'True' }}
        run: |
          cd fms.frontend
          npm ci
        shell: cmd

      - name: Skip dependencies installation (using cached node_modules)
        if: ${{ needs.detect-changes.outputs.package-changed != 'True' }}
        run: |
          echo "Skipping npm ci - no changes to package.json or package-lock.json detected"
        shell: cmd

      - name: Build React app
        run: |
          cd fms.frontend
          npm run build
        shell: cmd

      - name: Deploy frontend
        run: |
          # Check if deploy script exists
          IF EXIST "deploy.ps1" (
            echo "Deploy script found at ./deploy.ps1"

            # Run with error checking and log file
            powershell -File ./deploy.ps1 -frontendOnly -logFile "./frontend_deploy_log.txt"
            IF %ERRORLEVEL% NEQ 0 (
              echo "Error: Frontend deployment failed with exit code %ERRORLEVEL%"
              echo "Deployment log contents:"
              type "./frontend_deploy_log.txt"
              exit %ERRORLEVEL%
            ) ELSE (
              echo "Frontend deployment completed successfully"
              echo "Last 10 lines of deployment log:"
              powershell -Command "Get-Content -Path './frontend_deploy_log.txt' -Tail 10"
            )
          ) ELSE (
            echo "Error: deploy.ps1 not found in the repository root"
            dir
            exit 1
          )
        shell: cmd

  deploy-backend-only:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend-changed == 'True' && needs.detect-changes.outputs.frontend-changed != 'True' }}
    runs-on: [self-hosted, Windows, X64, HYFMS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Publish .NET Web API
        run: |
          cd FMS.WebClient
          powershell -File ./deploy.ps1 -logFile "./full_deploy_log.txt" -buildOnServer $true
        shell: cmd

      - name: Deploy backend
        run: |
          # Check if deploy script exists
          IF EXIST "deploy.ps1" (
            echo "Deploy script found at ./deploy.ps1"

            # Run with error checking and log file
            powershell -File ./deploy.ps1 -backendOnly -logFile "./backend_deploy_log.txt"
            IF %ERRORLEVEL% NEQ 0 (
              echo "Error: Backend deployment failed with exit code %ERRORLEVEL%"
              echo "Deployment log contents:"
              type "./backend_deploy_log.txt"
              exit %ERRORLEVEL%
            ) ELSE (
              echo "Backend deployment completed successfully"
              echo "Last 10 lines of deployment log:"
              powershell -Command "Get-Content -Path './backend_deploy_log.txt' -Tail 10"
            )
          ) ELSE (
            echo "Error: deploy.ps1 not found in the repository root"
            dir
            exit 1
          )
        shell: cmd

  deploy-both:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'True' && needs.detect-changes.outputs.backend-changed == 'True' }}
    runs-on: [self-hosted, Windows, X64, HYFMS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install React dependencies
        if: ${{ needs.detect-changes.outputs.package-changed == 'True' }}
        run: |
          cd fms.frontend
          npm ci
        shell: cmd

      - name: Skip dependencies installation (using cached node_modules)
        if: ${{ needs.detect-changes.outputs.package-changed != 'True' }}
        run: |
          echo "Skipping npm ci - no changes to package.json or package-lock.json detected"
        shell: cmd

      - name: Build React app
        run: |
          cd fms.frontend
          npm run build
        shell: cmd

      - name: Publish .NET Web API
        run: |
          cd FMS.WebClient
          powershell -File ./deploy.ps1 -logFile "./full_deploy_log.txt" -buildOnServer $true

        shell: cmd

      - name: Run full deploy script
        run: |
          # Check if deploy script exists and show its path
          IF EXIST "deploy.ps1" (
            echo "Deploy script found at ./deploy.ps1"
            powershell -Command "Get-ChildItem ./deploy.ps1 | Select-Object FullName, LastWriteTime, Length | Format-List"

            # Execute the script with error checking and log file
            powershell -File ./deploy.ps1 -logFile "./full_deploy_log.txt"
            IF %ERRORLEVEL% NEQ 0 (
              echo "Error: Full deployment failed with exit code %ERRORLEVEL%"
              echo "Deployment log contents:"
              type "./full_deploy_log.txt"
              exit %ERRORLEVEL%
            ) ELSE (
              echo "Full deployment completed successfully"
              echo "Last 10 lines of deployment log:"
              powershell -Command "Get-Content -Path './full_deploy_log.txt' -Tail 10"

              # Upload log file as an artifact in GitHub Actions
              echo "Creating deployment summary..."
              powershell -Command "if (Test-Path './full_deploy_log.txt') { Copy-Item './full_deploy_log.txt' './deployment-summary.txt' }"
            )
          ) ELSE (
            echo "Error: deploy.ps1 not found in the repository root"
            echo "Current directory contents:"
            dir
            exit 1
          )
        shell: cmd
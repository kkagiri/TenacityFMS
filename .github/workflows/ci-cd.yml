name: Selective Deploy
on:
  push:
    branches:
      - productionv1
jobs:
  detect-changes:
    runs-on: [self-hosted, Windows, X64, HYFMS]
    outputs:
      frontend-changed: ${{ steps.check-changes.outputs.frontend-changed }}
      backend-changed: ${{ steps.check-changes.outputs.backend-changed }}
      package-changed: ${{ steps.check-changes.outputs.package-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 2

      - name: Check for changes
        id: check-changes
        run: |
          $changedFiles = git diff --name-only HEAD^ HEAD

          $frontendChanged = ($changedFiles | Where-Object { $_ -like "fms.frontend/*" }) -ne $null

          # Improved backend change detection to include all backend projects
          $backendChanged = ($changedFiles | Where-Object {
            $_ -like "FMS.WebClient/*" -or
            $_ -like "FMS.Application/*" -or
            $_ -like "FMS.Persistence/*" -or
            $_ -like "FMS.Domain/*" -or
            $_ -like "FMS.Infrastructure/*" -or
            $_ -like "FMS.BackgroundServices/*" -or
            $_ -like "FMS.Testing/*"
          }) -ne $null

          $packageChanged = ($changedFiles | Where-Object { $_ -like "fms.frontend/package*.json" }) -ne $null

          Write-Host "::set-output name=frontend-changed::$frontendChanged"
          Write-Host "::set-output name=backend-changed::$backendChanged"
          Write-Host "::set-output name=package-changed::$packageChanged"

          Write-Host "Frontend changed: $frontendChanged"
          Write-Host "Backend changed: $backendChanged"
          Write-Host "Package files changed: $packageChanged"
        shell: powershell

  deploy-frontend-only:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'True' && needs.detect-changes.outputs.backend-changed != 'True' }}
    runs-on: [self-hosted, Windows, X64, HYFMS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check React frontend project
        run: |
          echo "Using pre-built React frontend"
          if exist "fms.frontend" (
            echo "fms.frontend directory found"
          ) else (
            echo "Warning: fms.frontend directory not found"
          )
        shell: cmd

      - name: Deploy frontend
        run: |
          # Check if deploy script exists
          IF EXIST "deploy.ps1" (
            echo "Deploy script found at ./deploy.ps1"

            # Run with error checking
            powershell -File ./deploy.ps1 -frontendOnly
            IF %ERRORLEVEL% NEQ 0 (
              echo "Error: Frontend deployment failed with exit code %ERRORLEVEL%"
              echo "Checking for deployment log..."
              powershell -Command "Get-ChildItem -Path './logs' -Filter 'deployment_log_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { echo \"Log file: $_\"; Get-Content -Path $_.FullName }"
              exit %ERRORLEVEL%
            ) ELSE (
              echo "Frontend deployment completed successfully"
              echo "Recent deployment log:"
              powershell -Command "Get-ChildItem -Path './logs' -Filter 'deployment_log_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { echo \"Log file: $_\"; Get-Content -Path $_.FullName -Tail 10 }"
            )
          ) ELSE (
            echo "Error: deploy.ps1 not found in the repository root"
            dir
            exit 1
          )
        shell: cmd

  deploy-backend-only:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend-changed == 'True' && needs.detect-changes.outputs.frontend-changed != 'True' }}
    runs-on: [self-hosted, Windows, X64, HYFMS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check .NET Web API project
        run: |
          echo "Using pre-built .NET Web API project"

          # Check for all backend projects
          set MISSING_PROJECTS=0

          if not exist "FMS.WebClient" (
            echo "Warning: FMS.WebClient directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.WebClient directory found"
          )

          if not exist "FMS.Application" (
            echo "Warning: FMS.Application directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.Application directory found"
          )

          if not exist "FMS.Persistence" (
            echo "Warning: FMS.Persistence directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.Persistence directory found"
          )

          if not exist "FMS.Domain" (
            echo "Warning: FMS.Domain directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.Domain directory found"
          )

          if not exist "FMS.Infrastructure" (
            echo "Warning: FMS.Infrastructure directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.Infrastructure directory found"
          )

          if %MISSING_PROJECTS% NEQ 0 (
            echo "Warning: Some backend projects are missing, but continuing with deployment"
          ) else (
            echo "All required backend projects found"
          )
        shell: cmd

      - name: Deploy backend
        run: |
          # Check if deploy script exists
          IF EXIST "deploy.ps1" (
            echo "Deploy script found at ./deploy.ps1"

            # Run with error checking and additional parameters
            powershell -File ./deploy.ps1 -backendOnly -verbose -skipHealthCheck
            IF %ERRORLEVEL% NEQ 0 (
              echo "Error: Backend deployment failed with exit code %ERRORLEVEL%"
              echo "Checking for deployment log..."
              powershell -Command "Get-ChildItem -Path './logs' -Filter 'deployment_log_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { echo \"Log file: $_\"; Get-Content -Path $_.FullName }"
              exit %ERRORLEVEL%
            ) ELSE (
              echo "Backend deployment completed successfully"
              echo "Recent deployment log:"
              powershell -Command "Get-ChildItem -Path './logs' -Filter 'deployment_log_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { echo \"Log file: $_\"; Get-Content -Path $_.FullName -Tail 10 }"
            )
          ) ELSE (
            echo "Error: deploy.ps1 not found in the repository root"
            dir
            exit 1
          )
        shell: cmd

  deploy-both:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'True' && needs.detect-changes.outputs.backend-changed == 'True' }}
    runs-on: [self-hosted, Windows, X64, HYFMS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check project directories
        run: |
          echo "Using pre-built projects"

          echo "Checking frontend project:"
          if exist "fms.frontend" (
            echo "fms.frontend directory found"
          ) else (
            echo "Warning: fms.frontend directory not found"
          )

          echo "Checking backend projects:"
          set MISSING_PROJECTS=0

          if not exist "FMS.WebClient" (
            echo "Warning: FMS.WebClient directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.WebClient directory found"
          )

          if not exist "FMS.Application" (
            echo "Warning: FMS.Application directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.Application directory found"
          )

          if not exist "FMS.Persistence" (
            echo "Warning: FMS.Persistence directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.Persistence directory found"
          )

          if not exist "FMS.Domain" (
            echo "Warning: FMS.Domain directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.Domain directory found"
          )

          if not exist "FMS.Infrastructure" (
            echo "Warning: FMS.Infrastructure directory not found"
            set MISSING_PROJECTS=1
          ) else (
            echo "FMS.Infrastructure directory found"
          )

          if %MISSING_PROJECTS% NEQ 0 (
            echo "Warning: Some backend projects are missing, but continuing with deployment"
          ) else (
            echo "All required backend projects found"
          )
        shell: cmd

      - name: Run full deploy script
        run: |
          # Check if deploy script exists and show its path
          IF EXIST "deploy.ps1" (
            echo "Deploy script found at ./deploy.ps1"
            powershell -Command "Get-ChildItem ./deploy.ps1 | Select-Object FullName, LastWriteTime, Length | Format-List"

            # Execute the script with error checking
            powershell -File ./deploy.ps1
            IF %ERRORLEVEL% NEQ 0 (
              echo "Error: Full deployment failed with exit code %ERRORLEVEL%"
              echo "Checking for deployment log..."
              powershell -Command "Get-ChildItem -Path './logs' -Filter 'deployment_log_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { echo \"Log file: $_\"; Get-Content -Path $_.FullName }"
              exit %ERRORLEVEL%
            ) ELSE (
              echo "Full deployment completed successfully"
              echo "Recent deployment log:"
              powershell -Command "Get-ChildItem -Path './logs' -Filter 'deployment_log_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object { echo \"Log file: $_\"; Get-Content -Path $_.FullName -Tail 10 }"
            )
          ) ELSE (
            echo "Error: deploy.ps1 not found in the repository root"
            echo "Current directory contents:"
            dir
            exit 1
          )
        shell: cmd

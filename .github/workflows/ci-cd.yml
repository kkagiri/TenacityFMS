name: Deploy
on:
  push:
    branches:
      - productionv1
jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64, HYFMS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Check directory structure (CMD)
        run: |
          dir
          echo "Listing all directories in the repository:"
          dir /AD /B
        shell: cmd
        
      - name: Check directory structure (PowerShell)
        run: |
          Write-Host "Checking for fms.frontend directory:"
          if (Test-Path -Path "fms.frontend") {
            Write-Host "fms.frontend directory exists"
          } else {
            Write-Host "fms.frontend directory does NOT exist"
            Write-Host "Listing all directories in the repository:"
            Get-ChildItem -Directory | ForEach-Object { $_.Name }
          }
        shell: powershell
      
      # Only run these steps if the directories exist
      - name: Install React dependencies
        if: ${{ success() }}
        run: |
          IF EXIST "fms.frontend" (
            cd fms.frontend
            npm ci
          ) ELSE (
            echo "Skipping - fms.frontend directory not found"
            exit 1
          )
        shell: cmd
      
      - name: Build React app
        if: ${{ success() }}
        run: |
          IF EXIST "fms.frontend" (
            cd fms.frontend
            npm run build
          ) ELSE (
            echo "Skipping - fms.frontend directory not found"
            exit 1
          )
        shell: cmd
      
      - name: Publish .NET Web API
        if: ${{ success() }}
        run: |
          IF EXIST "FMS.WebClient" (
            cd FMS.WebClient
            dotnet publish -c Release -o publish
          ) ELSE (
            echo "Skipping - FMS.WebClient directory not found"
            exit 1
          )
        shell: cmd
      
      - name: Run deploy script
        if: ${{ success() }}
        run: |
          IF EXIST "deploy.ps1" (
            powershell -File ./deploy.ps1
          ) ELSE (
            echo "deploy.ps1 not found"
            exit 1
          )
        shell: cmd

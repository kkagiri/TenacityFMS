name: FMS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  # These can be set at repository level in GitHub secrets
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '18.x'

jobs:
  detect-changes:
    runs-on: [self-hosted, Windows, X64, HYFMS]
    outputs:
      frontend-changed: ${{ steps.check-changes.outputs.frontend-changed }}
      backend-changed: ${{ steps.check-changes.outputs.backend-changed }}
      deployment-changed: ${{ steps.check-changes.outputs.deployment-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: check-changes
        run: |
          $changedFiles = git diff --name-only HEAD^ HEAD
          Write-Host "Changed files:"
          $changedFiles | ForEach-Object { Write-Host "  $_" }

          $frontendChanged = ($changedFiles | Where-Object { $_ -like "fms.frontend/*" }) -ne $null
          $backendChanged = ($changedFiles | Where-Object {
            $_ -like "FMS.WebClient/*" -or
            $_ -like "FMS.Application/*" -or
            $_ -like "FMS.Persistence/*" -or
            $_ -like "FMS.Domain/*" -or
            $_ -like "FMS.Infrastructure/*" -or
            $_ -like "FMS.BackgroundServices/*" -or
            $_ -like "*.sln" -or
            $_ -like "*.csproj"
          }) -ne $null
          $deploymentChanged = ($changedFiles | Where-Object { $_ -like "FMS.Deployment/*" }) -ne $null

          echo "frontend-changed=$frontendChanged" >> $env:GITHUB_OUTPUT
          echo "backend-changed=$backendChanged" >> $env:GITHUB_OUTPUT
          echo "deployment-changed=$deploymentChanged" >> $env:GITHUB_OUTPUT

          Write-Host "Frontend changed: $frontendChanged"
          Write-Host "Backend changed: $backendChanged"
          Write-Host "Deployment changed: $deploymentChanged"
        shell: powershell

  build-and-test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' || needs.detect-changes.outputs.backend-changed == 'true' }}
    runs-on: [self-hosted, Windows, X64, HYFMS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: fms.frontend/package-lock.json

      - name: Restore .NET dependencies
        if: ${{ needs.detect-changes.outputs.backend-changed == 'true' }}
        run: dotnet restore Hyoung.Fms.sln

      - name: Build .NET solution
        if: ${{ needs.detect-changes.outputs.backend-changed == 'true' }}
        run: dotnet build Hyoung.Fms.sln --configuration Release --no-restore

      - name: Run .NET tests
        if: ${{ needs.detect-changes.outputs.backend-changed == 'true' }}
        run: dotnet test FMS.Testing --configuration Release --no-build --verbosity normal

      - name: Install frontend dependencies
        if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
        working-directory: fms.frontend
        run: npm ci

      - name: Build frontend
        if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
        working-directory: fms.frontend
        run: npm run build
        env:
          # Frontend environment variables from GitHub secrets
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

      - name: Run frontend tests
        if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
        working-directory: fms.frontend
        run: npm test -- --coverage --watchAll=false

  deploy-to-development:
    needs: [detect-changes, build-and-test]
    if: ${{ github.ref == 'refs/heads/develop' && (needs.detect-changes.outputs.frontend-changed == 'true' || needs.detect-changes.outputs.backend-changed == 'true') }}
    runs-on: [self-hosted, Windows, X64, HYFMS]
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development
        run: |
          # Set environment variables for development
          $env:ASPNETCORE_ENVIRONMENT = "Development"
          $env:FMS_CONNECTION_STRING = "${{ secrets.DEV_CONNECTION_STRING }}"
          $env:FMS_SMTP_SERVER = "${{ secrets.DEV_SMTP_SERVER }}"
          $env:FMS_SMTP_USERNAME = "${{ secrets.DEV_SMTP_USERNAME }}"
          $env:FMS_SMTP_PASSWORD = "${{ secrets.DEV_SMTP_PASSWORD }}"

          # Determine deployment type
          $frontendOnly = "${{ needs.detect-changes.outputs.frontend-changed == 'true' && needs.detect-changes.outputs.backend-changed != 'true' }}"
          $backendOnly = "${{ needs.detect-changes.outputs.backend-changed == 'true' && needs.detect-changes.outputs.frontend-changed != 'true' }}"

          # Run deployment
          cd FMS.Deployment
          if ($frontendOnly -eq "True") {
            .\deployment.cmd -f -e development -v
          } elseif ($backendOnly -eq "True") {
            .\deployment.cmd -b -e development -v
          } else {
            .\deployment.cmd -e development -v
          }
        shell: powershell

  deploy-to-production:
    needs: [detect-changes, build-and-test]
    if: ${{ github.ref == 'refs/heads/main' && (needs.detect-changes.outputs.frontend-changed == 'true' || needs.detect-changes.outputs.backend-changed == 'true') }}
    runs-on: [self-hosted, Windows, X64, HYFMS]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          # Set environment variables for production
          $env:ASPNETCORE_ENVIRONMENT = "Production"
          $env:FMS_CONNECTION_STRING = "${{ secrets.PROD_CONNECTION_STRING }}"
          $env:FMS_SMTP_SERVER = "${{ secrets.PROD_SMTP_SERVER }}"
          $env:FMS_SMTP_USERNAME = "${{ secrets.PROD_SMTP_USERNAME }}"
          $env:FMS_SMTP_PASSWORD = "${{ secrets.PROD_SMTP_PASSWORD }}"

          # Determine deployment type
          $frontendOnly = "${{ needs.detect-changes.outputs.frontend-changed == 'true' && needs.detect-changes.outputs.backend-changed != 'true' }}"
          $backendOnly = "${{ needs.detect-changes.outputs.backend-changed == 'true' && needs.detect-changes.outputs.frontend-changed != 'true' }}"

          # Run deployment with rollback capability
          cd FMS.Deployment
          if ($frontendOnly -eq "True") {
            .\deployment.cmd -f -e production -v -r
          } elseif ($backendOnly -eq "True") {
            .\deployment.cmd -b -e production -v -r
          } else {
            .\deployment.cmd -e production -v -r
          }
        shell: powershell

      - name: Run post-deployment tests
        run: |
          # Wait for services to start
          Start-Sleep -Seconds 30

          # Test API health endpoint
          $healthUrl = "${{ secrets.PROD_HEALTH_CHECK_URL }}"
          try {
            $response = Invoke-RestMethod -Uri $healthUrl -Method Get -TimeoutSec 30
            Write-Host "Health check passed: $response"
          } catch {
            Write-Error "Health check failed: $_"
            exit 1
          }
        shell: powershell

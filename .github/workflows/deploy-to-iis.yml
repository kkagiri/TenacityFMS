name: Deploy Hyoung FMS to IIS

on:
  push:
    branches: [productionv1, main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 🧹 Pre-Deployment Cleanup
        continue-on-error: true
        run: |
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  Pre-Deployment Cleanup" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host ""

          # Define workspace path
          $workspacePath = "C:\actions-runner\_work\Hyoung.FMS\Hyoung.FMS"

          # Stop any running Node.js processes from previous builds
          Write-Host "Stopping Node.js processes..." -ForegroundColor Yellow
          $nodeProcesses = Get-Process -Name "node" -ErrorAction SilentlyContinue
          if ($nodeProcesses) {
            $nodeProcesses | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Host "  Stopped $($nodeProcesses.Count) Node.js process(es)" -ForegroundColor Green
          } else {
            Write-Host "  No Node.js processes found" -ForegroundColor Green
          }

          # Wait for file handles to be released
          Start-Sleep -Seconds 5

          # Try to remove problematic directories
          $dirsToClean = @(
            "fms.frontend\node_modules",
            "fms.frontend\build"
          )

          foreach ($dir in $dirsToClean) {
            $fullPath = Join-Path $workspacePath $dir
            if (Test-Path $fullPath) {
              Write-Host "Removing $dir..." -ForegroundColor Yellow
              Remove-Item $fullPath -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host ""
          Write-Host "Cleanup completed" -ForegroundColor Green
          Write-Host ""
        shell: powershell

      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "fms.frontend/package-lock.json"

      # ========================================
      # RUN DEPLOYMENT SCRIPT
      # ========================================

      - name: 🚀 Deploy to IIS (Using Proven Script)
        run: |
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  Running Deployment Script" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host ""

          # Ensure npm dependencies are installed
          Write-Host "Installing npm dependencies..." -ForegroundColor Yellow
          Push-Location "fms.frontend"
          if (Test-Path "node_modules") {
            Remove-Item "node_modules" -Recurse -Force -ErrorAction SilentlyContinue
          }
          npm ci
          Pop-Location

          Write-Host ""
          Write-Host "Running deploy-alternative.ps1..." -ForegroundColor Yellow
          Write-Host ""

          # Run the proven deployment script
          .\scripts\deploy-alternative.ps1

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Deployment script failed"
            exit 1
          }
        shell: powershell

      # ========================================
      # POST-DEPLOYMENT
      # ========================================

      - name: 🧹 Post-Deployment Cleanup
        if: always()
        continue-on-error: true
        run: |
          Write-Host ""
          Write-Host "========================================" -ForegroundColor Yellow
          Write-Host "  Post-Deployment Cleanup" -ForegroundColor Yellow
          Write-Host "========================================" -ForegroundColor Yellow
          Write-Host ""

          # Stop any lingering Node.js processes
          $nodeProcesses = Get-Process -Name "node" -ErrorAction SilentlyContinue
          if ($nodeProcesses) {
            $nodeProcesses | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Host "Stopped $($nodeProcesses.Count) Node.js process(es)" -ForegroundColor Green
          }

          # Clean npm cache
          npm cache clean --force 2>$null

          Write-Host "Cleanup completed" -ForegroundColor Green
          Write-Host ""
        shell: powershell
